name: Build and Deploy PaddleOCR Web Prototype to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # ⚠️ الرابط أدناه تخمين لمسار الملف داخل مستودع الحزمة — قد يتغيّر.
      # إن فشلت هذه الخطوة، افتح
      # https://github.com/phanbaohuy96/flutter-paddle-ocr/tree/main/example
      # يدويًا وحدِّث الرابط، أو الصق محتوى السكربت مباشرة هنا.
      - name: Fetch and run the package's own web bundling script
        run: |
          curl -fSL -o prepare_web.sh \
            https://raw.githubusercontent.com/phanbaohuy96/flutter-paddle-ocr/main/example/prepare_web.sh \
            || { echo "⚠️ تعذّر جلب prepare_web.sh تلقائيًا — راجع تعليق هذه الخطوة"; exit 1; }
          bash prepare_web.sh

      # Netlify يخدم من جذر الموقع مباشرة (على عكس GitHub Pages) — لا حاجة
      # لـ --base-href هنا.
      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: 'build/web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "نشر تلقائي من GitHub Actions — ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Note on success meaning
        run: |
          echo "⚠️ نجاح البناء/النشر لا يعني بالضرورة أن OCR يعمل فعليًا —"
          echo "فقط أن التجميع والرفع اكتملا. افتح رابط Netlify فعليًا وجرّب"
          echo "الزر على صورة حقيقية للتحقق (راجع README.md)."
