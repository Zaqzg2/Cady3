name: بناء APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: عرض إصدار Flutter
        run: flutter --version

      # يولّد مجلد android/ تلقائيًا فقط إن لم يكن موجودًا في المستودع بعد
      # (لأن هذا المستودع يحتوي كود Dart فقط ولا توجد بيئة Flutter محلية
      # لدى صاحب المشروع لتوليده يدويًا حاليًا).
      #
      # مهم جداً: هذه الخطوة يجب أن تسبق "flutter pub get" — لأن Flutter
      # يكتب ملف GeneratedPluginRegistrant.java (المسؤول عن ربط كل
      # الإضافات الفعلية بمحرك Flutter) بمحتوى صحيح فقط عندما يجد منصة
      # android موجودة أثناء pub get. إذا شغّلنا pub get قبل وجود
      # android/، يُكتب الملف بمحتوى فارغ (registerWith بلا أي استدعاء)،
      # ولاحقاً بما أننا نبني بـ --no-pub، هذا الملف الفارغ يبقى كما هو
      # للأبد — وهذا هو السبب الحقيقي لخطأ MissingPluginException.
      - name: توليد مجلد android إن لم يكن موجودًا
        run: |
          if [ ! -d "android" ]; then
            echo "لا يوجد مجلد android — يتم توليده الآن عبر flutter create"
            flutter create --platforms=android --org com.cady --project-name cadysalesapp /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          else
            echo "مجلد android موجود مسبقًا في المستودع — سيُستخدم كما هو"
          fi

      - name: تنزيل حزم Dart/Flutter
        run: flutter pub get

      # الحل الجذري لخطأ "It is too late to set compileSdk" (AgpDslLockedException)
      # ولخطأ ":file_picker is currently compiled against android-34":
      # نعدّل نص ملفات build.gradle الأصلية لكل حزمة مباشرة في مكانها الحقيقي
      # على القرص (نقرأ المسار الدقيق من .dart_tool/package_config.json الذي
      # يولّده pub get نفسه — لا تخمين لمكان الكاش)، قبل بدء أي تقييم Gradle.
      - name: رفع compileSdk إلى 36 داخل ملفات كل حزمة (عبر package_config.json)
        run: python3 scripts/patch_pubcache_compile_sdk.py 2>&1 | tee compile_sdk_patch_log.txt

      - name: تعطيل AGP 9 Built-in Kotlin (الحل الجذري لخطأ kotlin() في حزمة jni الفرعية)
        run: python3 scripts/patch_gradle_properties.py

      - name: ترقيع صلاحيات AndroidManifest (بلوتوث)
        run: python3 scripts/patch_manifest.py

      - name: رفع compileSdk/targetSdk إلى 36 (مطلوب لبعض الحزم مثل file_picker)
        run: python3 scripts/patch_compile_sdk.py

      - name: قبول تراخيص Android SDK وتثبيت المنصة 36
        run: |
          yes | flutter doctor --android-licenses || true
          SDKMANAGER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -name "sdkmanager" 2>/dev/null | head -n1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "تحذير: لم يُعثر على sdkmanager — سيحاول Gradle التنزيل التلقائي عند البناء"
          fi

      - name: فك تشفير الكيستور (Keystore) من الأسرار
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "تم فك تشفير الكيستور بنجاح"
          else
            echo "تنبيه: السر ANDROID_KEYSTORE_BASE64 غير موجود — سيُبنى APK بتوقيع debug فقط"
          fi

      - name: إنشاء key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f android/app/keystore.jks ]; then
            cat > android/key.properties << PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore.jks
          PROPS
            echo "تم إنشاء key.properties"
          fi

      - name: ترقيع build.gradle لإضافة توقيع الإصدار
        run: python3 scripts/patch_build_gradle.py

      # يحل خطأ MissingPluginException (مثل sqflite) الذي يظهر فقط في
      # بناء release: R8 (المفعّل افتراضياً لتصغير حجم APK) قد يحذف كود
      # تسجيل الإضافات (GeneratedPluginRegistrant) لأنه يُستدعى بطريقة
      # غير مباشرة. نعطّل R8 صراحة لأن هذا تطبيق داخلي لا يحتاج تصغير حجم.
      - name: تعطيل R8/minification لتفادي حذف تسجيل الإضافات (plugins)
        run: python3 scripts/patch_disable_minify.py

      - name: عرض محتوى build.gradle النهائي (للتشخيص)
        run: |
          echo "===== android/gradle.properties بعد كل الترقيعات ====="
          cat android/gradle.properties 2>/dev/null
          echo "===== android/build.gradle(.kts) الجذري بعد كل الترقيعات ====="
          cat android/build.gradle.kts 2>/dev/null || cat android/build.gradle 2>/dev/null
          echo "===== android/app/build.gradle(.kts) بعد كل الترقيعات ====="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null

      - name: التحقق من سلامة الكيستور (تشخيص مشاكل التوقيع)
        if: hashFiles('android/app/keystore.jks') != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "حجم ملف الكيستور:"
          ls -la android/app/keystore.jks

          echo ""
          echo "===== الخطوة 1: التحقق من نوع الكيستور ====="
          STORE_TYPE=$(keytool -list -v -keystore android/app/keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep "Keystore type:" | awk '{print $NF}')
          echo "Keystore type: $STORE_TYPE"

          echo ""
          echo "===== الخطوة 2: التحقق من تطابق كلمة مرور المخزن والمفتاح ====="
          if [ "$STORE_TYPE" = "PKCS12" ]; then
            echo "ملاحظة: PKCS12 لا يدعم كلمة مرور منفصلة للمفتاح — يجب أن تكون"
            echo "ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_PASSWORD متطابقتين تماماً."
            if [ "$ANDROID_KEYSTORE_PASSWORD" != "$ANDROID_KEY_PASSWORD" ]; then
              echo "❌ فشل: السرّان ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_PASSWORD"
              echo "   غير متطابقين، وهذا كيستور من نوع PKCS12 — لازم يكونا نفس القيمة."
              echo "   الحل: أعد تشغيل generate-keystore.yml (النسخة المحدَّثة تولّد"
              echo "   كلمة مرور واحدة فقط لكليهما تلقائياً)، ثم حدّث كل الأسرار الأربعة"
              echo "   معاً من نفس التشغيلة الجديدة."
              exit 1
            fi
            echo "✅ كلمتا المرور متطابقتان — متوافق مع متطلبات PKCS12."
          fi

          echo ""
          echo "===== الخطوة 3: عرض تفاصيل الشهادة (بدون كشف كلمات المرور) ====="
          keytool -list -v -keystore android/app/keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" | head -20

      - name: بناء APK (release)
        run: flutter build apk --release --verbose --no-pub

      # نسخة debug تشخيصية إضافية: في debug، Flutter يعرض شاشة الخطأ
      # الحمراء الكاملة تلقائياً (مع تتبّع كامل يشمل اسم الملف والسطر
      # بالضبط) بدل الرسالة المختصرة في release. توقيعها تلقائي (مفتاح
      # debug افتراضي)، فلا تحتاج أي إعداد إضافي — للتشخيص فقط، لا تُنشر.
      - name: بناء APK تشخيصي (debug) — لعرض تفاصيل الخطأ الكاملة فقط
        run: flutter build apk --debug --no-pub

      - name: رفع APK التشخيصي (debug) كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-diagnostic-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: تشخيص تسجيل الإضافات (plugins) — دائماً يُرفع
        if: always()
        run: |
          {
            echo "===== .flutter-plugins-dependencies ====="
            cat .flutter-plugins-dependencies 2>/dev/null || echo "غير موجود"
            echo ""
            echo "===== .flutter-plugins ====="
            cat .flutter-plugins 2>/dev/null || echo "غير موجود"
            echo ""
            echo "===== البحث عن GeneratedPluginRegistrant.java/.kt ====="
            find . -iname "GeneratedPluginRegistrant*" 2>/dev/null
            echo ""
            echo "===== محتوى GeneratedPluginRegistrant (إن وُجد) ====="
            find . -iname "GeneratedPluginRegistrant*" -exec cat {} \; 2>/dev/null
            echo ""
            echo "===== هل sqflite مذكورة في .flutter-plugins-dependencies؟ ====="
            grep -o '"sqflite"[^}]*' .flutter-plugins-dependencies 2>/dev/null || echo "غير مذكورة!"
          } > plugin_registration_diagnostic.txt 2>&1
          cat plugin_registration_diagnostic.txt

      - name: رفع تشخيص تسجيل الإضافات كـ Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-registration-diagnostic
          path: plugin_registration_diagnostic.txt
          if-no-files-found: ignore

      - name: رفع سجلات Gradle عند الفشل (للتشخيص)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: |
            compile_sdk_patch_log.txt
            android/app/build/outputs/logs/**
            build/reports/**
            android/**/build/reports/**
            ~/.gradle/daemon/**/*.log
          if-no-files-found: ignore

      - name: رفع APK كمُخرَج للعمل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cady-sales-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
