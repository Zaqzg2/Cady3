name: توليد كيستور (Keystore) للتوقيع - مرة واحدة فقط

# هذا الـ workflow يُشغَّل يدويًا فقط (لمرة واحدة عادةً) لإنشاء ملف
# التوقيع (keystore) في السحابة دون الحاجة لأي أدوات محلية.
# بعد التشغيل، حمّل الملف الناتج (Artifact) واحفظه في مكان آمن جدًا
# (لا يمكن استرجاعه إن ضاع)، ثم أضف قيمه كأسرار Secrets في المستودع.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'اسم مستعار المفتاح (key alias)'
        required: true
        default: 'cadysalesapp'
      validity_years:
        description: 'مدة صلاحية الشهادة بالسنوات'
        required: true
        default: '30'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: توليد كلمة مرور عشوائية قوية واحدة
        id: pass
        run: |
          # ملاحظة مهمة: نوع الكيستور الافتراضي في Java الحديثة هو PKCS12 (رغم
          # امتداد .jks)، وهذه الصيغة لا تدعم كلمة مرور منفصلة للمفتاح تختلف
          # عن كلمة مرور المخزن — الاثنتان يجب أن تكونا متطابقتين، وإلا يفشل
          # التوقيع لاحقاً بخطأ BadPaddingException غامض. لذلك نستخدم كلمة
          # مرور واحدة فقط لكليهما.
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          echo "store_pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: إنشاء الكيستور عبر keytool
        run: |
          VALIDITY_DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))
          keytool -genkeypair -v \
            -keystore android_keystore.jks \
            -storetype PKCS12 \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 \
            -validity "$VALIDITY_DAYS" \
            -storepass "${{ steps.pass.outputs.store_pass }}" \
            -keypass "${{ steps.pass.outputs.key_pass }}" \
            -dname "CN=Cady Sales App, OU=Sales, O=Cady Detergents, L=Sanaa, ST=Sanaa, C=YE"

      - name: تحويل الكيستور إلى Base64
        run: base64 -w0 android_keystore.jks > android_keystore_base64.txt

      - name: استخراج بصمة SHA256 (لملف assetlinks.json إن احتجتها لاحقًا)
        run: |
          keytool -list -v -keystore android_keystore.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -storepass "${{ steps.pass.outputs.store_pass }}" > keystore_info.txt
          cat keystore_info.txt

      - name: كتابة ملف الأسرار المطلوبة (احتفظ به بأمان تام)
        run: |
          cat > SECRETS_TO_ADD.txt << EOF
          ===========================================================
          أضف هذه القيم كأسرار (Secrets) في إعدادات المستودع على GitHub:
          Settings → Secrets and variables → Actions → New repository secret
          ===========================================================

          ANDROID_KEYSTORE_BASE64   -> محتوى ملف android_keystore_base64.txt كاملاً
          ANDROID_KEYSTORE_PASSWORD -> ${{ steps.pass.outputs.store_pass }}
          ANDROID_KEY_ALIAS         -> ${{ github.event.inputs.key_alias }}
          ANDROID_KEY_PASSWORD      -> ${{ steps.pass.outputs.key_pass }}

          تحذير مهم: احفظ نسخة من هذه القيم وملف الكيستور في مكان آمن
          خارج GitHub أيضًا (مثل مدير كلمات مرور). فقدان الكيستور يعني
          عدم القدرة مستقبلاً على نشر تحديثات لنفس التطبيق على Google Play
          أو نفس توقيع التطبيق المثبت لدى المستخدمين.
          EOF
          cat SECRETS_TO_ADD.txt

      - name: رفع الملفات الناتجة كـ Artifact (حمّلها فورًا واحذفها من هنا لاحقًا)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-and-secrets
          path: |
            android_keystore.jks
            android_keystore_base64.txt
            keystore_info.txt
            SECRETS_TO_ADD.txt
          retention-days: 1
