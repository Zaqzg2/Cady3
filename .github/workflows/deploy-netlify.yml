name: بناء ونشر على Netlify

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # يولّد مجلد web/ تلقائيًا فقط إن لم يكن موجودًا في المستودع بعد
      - name: توليد مجلد web إن لم يكن موجودًا
        run: |
          if [ ! -d "web" ]; then
            echo "لا يوجد مجلد web — يتم توليده الآن عبر flutter create"
            flutter create --platforms=web --org com.cady --project-name cadysalesapp /tmp/scaffold
            cp -r /tmp/scaffold/web ./web
          else
            echo "مجلد web موجود مسبقًا في المستودع — سيُستخدم كما هو"
          fi

      - name: تنزيل حزم Dart/Flutter
        run: flutter pub get

      - name: تفعيل دعم الويب
        run: flutter config --enable-web

      - name: بناء نسخة الويب (release)
        run: flutter build web --release

      - name: النشر على Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: 'build/web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "نشر تلقائي من GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
