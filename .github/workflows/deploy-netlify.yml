name: نشر نسخة الويب على Netlify

# ينشر نسخة ويب من التطبيق تلقائيًا على Netlify:
# - عند كل push لفرع main (نفس منطق build-apk.yml).
# - يدويًا من تبويب Actions عبر workflow_dispatch.
#
# البناء نفسه يتم هنا داخل GitHub Actions (وليس عبر نظام بناء Netlify، الذي
# لا يحتوي Flutter SDK أصلًا) — ثم يُرفَع مجلد build/web الجاهز مباشرة عبر
# Netlify CLI. راجع قسم "النشر على Netlify" في README.md لخطوات الإعداد
# الأولية (مرة واحدة فقط: إنشاء موقع Netlify + الأسرار).

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      # نتحقق من الأسرار المطلوبة قبل أي خطوة بناء، لتفادي إهدار وقت
      # التشغيل (build minutes) إن لم يكتمل إعداد Netlify بعد.
      - name: التحقق من وجود أسرار Netlify
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "❌ السرّان NETLIFY_AUTH_TOKEN و/أو NETLIFY_SITE_ID غير مضبوطين."
            echo "   أضفهما من: Settings → Secrets and variables → Actions → New repository secret"
            echo "   راجع قسم «النشر على Netlify» في README.md لمعرفة كيفية الحصول عليهما."
            exit 1
          fi
          echo "✅ الأسرار المطلوبة موجودة."

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: عرض إصدار Flutter
        run: flutter --version

      # نفس سبب توليد android/ في build-apk.yml بالضبط: يجب أن يكون مجلد
      # web/ موجودًا في المستودع *قبل* "flutter pub get"، وإلا تُسجَّل
      # الإضافات (plugins) الخاصة بالويب بمحتوى ناقص بشكل دائم — لأن البناء
      # لاحقًا يستخدم --no-pub فلا تُعاد المحاولة تلقائيًا.
      - name: توليد مجلد web إن لم يكن موجودًا
        run: |
          if [ ! -d "web" ]; then
            echo "لا يوجد مجلد web — يتم توليده الآن عبر flutter create"
            flutter create --platforms=web --org com.cady --project-name cadysalesapp /tmp/scaffold_web
            cp -r /tmp/scaffold_web/web ./web
          else
            echo "مجلد web موجود مسبقًا في المستودع — سيُستخدم كما هو"
          fi

      - name: تنزيل حزم Dart/Flutter
        run: flutter pub get

      # ملاحظة: لا نستخدم "--web-renderer" — هذا الخيار أُزيل نهائيًا من
      # أداة flutter (لم يعد موجودًا في الإصدارات الحديثة)، والبناء يستخدم
      # الآن محرك CanvasKit تلقائيًا بلا حاجة لتحديده.
      - name: بناء نسخة الويب (release)
        run: flutter build web --release --no-pub

      # شبكة أمان قياسية لاستضافة أي تطبيق صفحة واحدة (SPA) على Netlify:
      # تُعيد أي مسار غير موجود فعليًا إلى index.html بدل صفحة 404. غير
      # حرجة حاليًا (التطبيق لا يعكس مسارات في شريط العنوان) لكنها مفيدة
      # مستقبلًا ولا تُكلّف شيئًا الآن.
      - name: إضافة قاعدة إعادة التوجيه لصفحة واحدة (SPA fallback)
        run: echo "/*    /index.html   200" > build/web/_redirects

      - name: تجهيز Node.js (مطلوب لـ Netlify CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # مثبَّتة على إصدار محدد عمدًا بدل "أحدث إصدار": تثبيت "أحدث إصدار"
      # داخل CI يعني أن أي تحديث كسّار (breaking change) مستقبلي في الحزمة
      # قد يُفشل هذا الـ workflow دون أي تغيير من جهتك. لتحديث النسخة لاحقًا،
      # غيّر الرقم بعد "@" في السطر التالي.
      - name: تثبيت Netlify CLI
        run: npm install -g netlify-cli@23.13.0

      - name: النشر على Netlify (إنتاج)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --prod \
            --dir=build/web \
            --message "نشر تلقائي من GitHub Actions - ${{ github.sha }}"
