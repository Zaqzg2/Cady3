name: بناء ونشر نسخة الويب

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: عرض إصدار Flutter
        run: flutter --version

      # يولّد مجلد web/ تلقائيًا فقط إن لم يكن موجودًا في المستودع بعد
      - name: توليد مجلد web إن لم يكن موجودًا
        run: |
          if [ ! -d "web" ]; then
            echo "لا يوجد مجلد web — يتم توليده الآن عبر flutter create"
            flutter create --platforms=web --org com.cady --project-name cadysalesapp /tmp/scaffold
            cp -r /tmp/scaffold/web ./web
          else
            echo "مجلد web موجود مسبقًا في المستودع — سيُستخدم كما هو"
          fi

      - name: تنزيل حزم Dart/Flutter
        run: flutter pub get

      - name: تفعيل دعم الويب
        run: flutter config --enable-web

      # اسم المستودع يُستخدم كـ base-href حتى تعمل الروابط بشكل صحيح على GitHub Pages
      - name: بناء نسخة الويب (release)
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: رفع الملفات إلى GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: نشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
