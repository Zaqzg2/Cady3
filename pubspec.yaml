name: paddleocr_web_prototype
description: "Prototype معزول لاختبار PaddleOCR العربي عبر الويب فقط قبل أي قرار بدمجه في التطبيق الرئيسي"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ⚠️ حزمة تجريبية جدًا (v0.0.2، منشورة قبل 4 أشهر فقط، ناشر غير موثَّق).
  # هذا بالضبط سبب عزل هذا الـ Prototype عن التطبيق الرئيسي.
  flutter_paddle_ocr: ^0.0.2

  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
