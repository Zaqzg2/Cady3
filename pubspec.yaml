name: cady_sales_app
description: تطبيق مندوب مبيعات - كادي للمنظفات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # مطلوبة لتوفير MaterialLocalizations/WidgetsLocalizations للعربية —
  # بدونها تفشل أي widget يعتمد عليها (AppBar, TextField, إلخ) بخطأ:
  # "AppBar widgets require MaterialLocalizations to be provided by
  #  a Localizations widget ancestor"
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # قاعدة البيانات المحلية (فواتير / عملاء / منتجات / سندات) — Hive
  # (nosql سريعة وخفيفة، تعمل على الجوال والويب معًا عبر IndexedDB)
  hive_ce_flutter: ^2.3.4

  # التنسيقات (تاريخ / عملة ريال يمني)
  intl: ^0.20.2

  # معرفات فريدة
  uuid: ^4.4.2

  # PDF حقيقي بعرض 80مم
  pdf: ^3.11.1
  printing: ^5.13.2

  # التقاط توقيع العميل/المندوب باللمس
  signature: ^5.5.0

  # اختيار/تحميل شعار الشركة
  image_picker: ^1.1.2

  # مشاركة الملفات (PDF) عبر التطبيقات
  share_plus: ^12.0.2

  # طباعة حرارية 80مم عبر بلوتوث (ESC/POS)
  permission_handler: ^11.3.1
  image: ^4.2.0

  # تخزين إعدادات بسيطة (اسم المندوب، بيانات الشركة، آخر رقم مستند)
  shared_preferences: ^2.3.2

  # حماية التطبيق بكلمة مرور (تشفير أحادي الاتجاه)
  crypto: ^3.0.3

  # اختيار ملف النسخة الاحتياطية عند الاستيراد
  file_picker: ^8.1.2

  # إجراءات السحب (يمين/يسار) على بطاقة العميل وسجل النشاط
  flutter_slidable: ^3.1.1

  # اتصال هاتفي / فتح واتساب / فتح الموقع على الخريطة من بطاقة العميل
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
